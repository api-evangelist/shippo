# ─── Query ───────────────────────────────────────────────────────────────────

type Query {
  # Addresses
  address(id: ID!): Address
  addresses(page: Int, pageSize: Int): AddressPage!

  # Parcels
  parcel(id: ID!): Parcel
  parcels(page: Int, pageSize: Int): ParcelPage!

  # Shipments
  shipment(id: ID!): Shipment
  shipments(page: Int, pageSize: Int, objectResults: String): ShipmentPage!

  # Rates (retrieved via shipment)
  rates(shipmentId: ID!): [Rate!]!
  rate(id: ID!): Rate

  # Transactions
  transaction(id: ID!): Transaction
  transactions(page: Int, pageSize: Int, rate: ID): TransactionPage!

  # Tracking
  track(carrier: String!, trackingNumber: String!): TrackingStatus

  # Carrier accounts
  carrierAccount(id: ID!): CarrierAccount
  carrierAccounts(page: Int, pageSize: Int, carrier: String, test: Boolean): CarrierAccountPage!

  # Orders
  order(id: ID!): Order
  orders(page: Int, pageSize: Int, shopApp: String, orderStatus: OrderStatus): OrderPage!

  # Manifests
  manifest(id: ID!): Manifest
  manifests(page: Int, pageSize: Int): ManifestPage!

  # Refunds
  refund(id: ID!): Refund
  refunds(page: Int, pageSize: Int): RefundPage!

  # Batches
  batch(id: ID!): Batch
  batches(page: Int, pageSize: Int): BatchPage!

  # User parcels
  userParcel(id: ID!): UserParcel
  userParcels(page: Int, pageSize: Int): UserParcelPage!

  # Customs
  customsItem(id: ID!): CustomsItem
  customsItems(page: Int, pageSize: Int): CustomsItemPage!
  customsDeclaration(id: ID!): CustomsDeclaration
  customsDeclarations(page: Int, pageSize: Int): CustomsDeclarationPage!

  # Carriers (static reference data)
  carriers: [Carrier!]!
  carrier(token: String!): Carrier
}

# ─── Mutation ────────────────────────────────────────────────────────────────

type Mutation {
  # Addresses
  createAddress(input: AddressInput!): Address!
  validateAddress(id: ID!): Address!

  # Parcels
  createParcel(input: ParcelInput!): Parcel!

  # Shipments
  createShipment(input: ShipmentInput!): Shipment!

  # Transactions (purchase a label)
  createTransaction(input: TransactionInput!): Transaction!

  # Carrier accounts
  createCarrierAccount(input: CarrierAccountInput!): CarrierAccount!
  updateCarrierAccount(id: ID!, input: CarrierAccountInput!): CarrierAccount!

  # Orders
  createOrder(input: OrderInput!): Order!

  # Manifests
  createManifest(input: ManifestInput!): Manifest!

  # Pickups
  createPickup(input: PickupInput!): Pickup!

  # Refunds
  createRefund(transactionId: ID!): Refund!

  # Batches
  createBatch(input: BatchInput!): Batch!
  addShipmentsToBatch(batchId: ID!, shipments: [BatchShipmentInput!]!): Batch!
  removeShipmentsFromBatch(batchId: ID!, shipmentIds: [ID!]!): Batch!
  purchaseBatch(id: ID!): Batch!

  # User parcels
  createUserParcel(input: UserParcelInput!): UserParcel!
  updateUserParcel(id: ID!, input: UserParcelInput!): UserParcel!
  deleteUserParcel(id: ID!): Boolean!

  # Customs
  createCustomsItem(input: CustomsItemInput!): CustomsItem!
  createCustomsDeclaration(input: CustomsDeclarationInput!): CustomsDeclaration!
}
