# Shippo GraphQL Schema (Conceptual)
#
# Shippo is REST-only. This SDL is derived from the public REST API specification
# at https://docs.goshippo.com/spec/shippoapi/public-api.yaml and official docs.
# Types, fields, and enums map to Shippo REST resources and their documented attributes.

scalar DateTime
scalar JSON

# ─── Enums ───────────────────────────────────────────────────────────────────

enum AddressValidationStatus {
  VALID
  INVALID
  INCOMPLETE
  UNKNOWN
}

enum ShipmentStatus {
  QUEUED
  WAITING
  SUCCESS
  ERROR
}

enum TransactionStatus {
  QUEUED
  WAITING
  SUCCESS
  ERROR
  REFUNDED
  REFUNDPENDING
  REFUNDREJECTED
}

enum TrackingStatusCode {
  UNKNOWN
  PRE_TRANSIT
  TRANSIT
  DELIVERED
  RETURNED
  FAILURE
}

enum ParcelTemplateCode {
  USPS_SmallFlatRateBox
  USPS_MediumFlatRateBox1
  USPS_MediumFlatRateBox2
  USPS_LargeFlatRateBox
  FedEx_FedExEnvelope
  FedEx_FedExPak
  FedEx_FedExBox
  UPS_UPSLetter
  UPS_UPSPak
  CUSTOM
}

enum DistanceUnit {
  cm
  in
  ft
  mm
  m
  yd
}

enum WeightUnit {
  g
  oz
  lb
  kg
}

enum LabelFileType {
  PNG
  PNG_2_3
  PDF
  PDF_2_3
  ZPLII
}

enum BatchStatus {
  VALIDATING
  VALID
  INVALID
  PURCHASING
  PURCHASED
}

enum CustomsContentsType {
  DOCUMENTS
  GIFT
  SAMPLE
  MERCHANDISE
  HUMANITARIAN_DONATION
  RETURN_MERCHANDISE
  OTHER
}

enum CustomsNonDeliveryOption {
  ABANDON
  RETURN
}

enum RefundStatus {
  PENDING
  ERROR
  SUCCESS
}

enum ManifestStatus {
  QUEUED
  WAITING
  SUCCESS
  ERROR
}

enum PickupStatus {
  QUEUED
  WAITING
  SUCCESS
  ERROR
}

enum OrderStatus {
  UNKNOWN
  AWAITPAY
  PAID
  REFUNDED
  CANCELLED
  PARTIALLY_FULFILLED
  SHIPPED
}

